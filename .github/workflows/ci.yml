name: CI

# Runs on every PR and push to main. Ubuntu only, to keep Actions minutes low.
# macOS/Windows builds live in release.yml (tags v* and manual runs).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Starts the real Electron app against the built output (scripts/smoke.mjs).
  # Needs a display, so it runs under xvfb. Kept as its own job so a smoke
  # failure doesn't hide the typecheck/test/build result.
  smoke:
    name: smoke (electron under xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which makes
      # Electron's sandbox abort on startup in CI.
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run smoke

  e2e:
    runs-on: ubuntu-latest
    env:
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # sem tocar no package-lock.json: instala so no job
      - run: npm install --no-save @playwright/test
      - run: xvfb-run --auto-servernum npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
