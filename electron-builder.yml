appId: com.anteriovieira.sala3d
productName: Sala 3D
copyright: Copyright © Antério Vieira

directories:
  output: dist
  buildResources: build

# Whitelist: only the electron-vite output and package.json go into the app.
# package.json must point "main" to out/main/index.js (ESM, "type": "module").
# Production node_modules are added automatically by electron-builder.
# docs/, src/, test/, scripts/ and *.md are NOT listed, so they stay out of the
# package (docs/ holds ~2 MB PNGs).
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: null # no code signing / notarization for now

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: AppImage
  category: Utility
